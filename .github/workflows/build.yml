name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: standalone
            self-contained: true
          - name: runtime-dependent
            self-contained: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish
        run: >
          dotnet publish src/Xplore.App -c Release -r win-x64
          --self-contained ${{ matrix.self-contained }}
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none -p:DebugSymbols=false
          -o artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: Xplore-${{ env.VERSION }}-win-x64-${{ matrix.name }}
          path: artifacts/publish/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)\*" -DestinationPath "artifacts\$($_.Name).zip"
          }

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
